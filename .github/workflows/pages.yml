name: Build and publish archive

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      archive_sync:
        description: Require a fresh comment export (server-triggered sync)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Test archive validation and separation
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Prepare separate comment archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_FRESH: ${{ inputs.archive_sync || false }}
        run: |
          if [ "$REQUIRE_FRESH" = "true" ]; then
            python3 scripts/sync_comments.py prepare --require-fresh
          else
            python3 scripts/sync_comments.py prepare
          fi
      - name: Build pinned Hugo with patched Go
        env:
          HUGO_VERSION: 0.168.0
          GO_VERSION: 1.27.3
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          # The upstream Hugo binary predates Go's October certificate-trust fix.
          curl --fail --location --retry 3 "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o "$RUNNER_TEMP/go.tar.gz"
          printf '65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40  %s\n' "$RUNNER_TEMP/go.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/go-toolchain" "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP/go-toolchain"
          export GOBIN="$RUNNER_TEMP/hugo-bin"
          export GOROOT="$RUNNER_TEMP/go-toolchain/go"
          # Go verifies the pinned source and dependencies against its checksum database.
          "$GOROOT/bin/go" install "github.com/gohugoio/hugo@v${HUGO_VERSION}"
          "$GOBIN/hugo" env | grep -Fx "GOVERSION=\"go${GO_VERSION}\""
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Build complete static site
        run: hugo --environment production
      - name: Check pages, media, links and feed
        run: python3 scripts/check_site.py
      - name: Package offline edition
        run: python3 scripts/package_archive.py
      - name: Preserve replaceable public comments on GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_comments.py publish
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v7
      - name: Retire old Pages build archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/cleanup_comment_artifacts.py
