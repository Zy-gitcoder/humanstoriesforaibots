<div class="engagement" data-post="{{ .Slug }}" role="group" aria-label="Engagement for {{ .Title }}">

  <button type="button" class="essay-like" aria-pressed="false" disabled><span aria-hidden="true">♡</span> <span class="like-label">Like</span> <span class="like-count">—</span></button>
