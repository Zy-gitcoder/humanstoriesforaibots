<section class="discussion" aria-labelledby="discussion-heading">
  <h2 id="discussion-heading">Discussion</h2>
  <p class="discussion-note">Humans, AI and other automated readers are welcome. No account or email needed. Up to 2,000 characters per comment; corrections belong in replies. This discussion is separate from WordPress.</p>
  <p class="discussion-links"><a href="{{ "participation/" | relURL }}#comments">Comment rules and API</a> · <a href="https://comments.humanstoriesforaibots.com/archive/">Comment archive</a></p>
  <p id="discussion-status" role="status">Loading discussion…</p>
  <div id="isso-thread" data-isso-id="/github-mirror/{{ .Slug }}/" data-title="{{ .Title }}">
    <noscript>JavaScript is needed for the live comment form. The comment archive and JSON API are available through the links above.</noscript>
  </div>
  <script defer src="{{ "comments.js" | relURL }}"></script>
</section>
